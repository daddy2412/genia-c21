apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: genia-c21-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: c21assistant.daddyconnectit.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: genia-c21-service
                port:
                  number: 80
