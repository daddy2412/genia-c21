apiVersion: apps/v1
kind: Deployment
metadata:
  name: genia-c21
spec:
  replicas: 2
  selector:
    matchLabels:
      app: genia-c21
  template:
    metadata:
      labels:
        app: genia-c21
    spec:
      containers:
        - name: genia-c21
          image: genia-c21:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: genia-c21-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
